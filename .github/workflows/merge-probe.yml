name: Merge probe

on:
  pull_request:
    types: [opened, synchronize]

permissions: {}

jobs:
  probe:
    if: github.base_ref == 'probe-base'
    runs-on: ubuntu-24.04
    steps:
      - name: Mint an app token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.MERGE_APP_ID }}
          private-key: ${{ secrets.MERGE_APP_PRIVATE_KEY }}

      - name: Attempt the merge, without and then with bypass_rules
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail

          attempt() {
            local bypass="$1" out code=0 uuid status poll

            echo "::group::merge-async with bypass_rules=$bypass"
            out="$(jq -n --arg sha "$HEAD_SHA" --argjson bypass "$bypass" \
              '{sha: $sha,
                merge_method: "squash",
                merge_action: "direct_merge",
                commit_title: "probe: merge into a locked branch through the app",
                commit_message: "Body supplied by the caller, to see what lands.",
                bypass_rules: $bypass}' |
              gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$PR/merge-async" --input - 2>&1)" || code=$?
            echo "exit=$code"
            echo "$out"

            uuid="$(jq -r '.details.uuid // empty' <<<"$out" 2>/dev/null)"
            if [ -z "$uuid" ]; then
              echo "no uuid to poll"
              echo "::endgroup::"
              return "$code"
            fi

            for _ in $(seq 1 12); do
              sleep 3
              poll="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/merge-async/$uuid" 2>&1)"
              echo "$poll"
              status="$(jq -r '.status // empty' <<<"$poll" 2>/dev/null)"
              case "$status" in
                merged | failed) break ;;
              esac
            done
            echo "::endgroup::"
            [ "$status" = merged ]
          }

          if attempt false; then
            echo "RESULT: merged without asking for a bypass"
          elif attempt true; then
            echo "RESULT: merged only with bypass_rules=true"
          else
            echo "RESULT: both attempts failed"
          fi

          echo "::group::resulting commits on the base branch"
          gh api "repos/$GITHUB_REPOSITORY/commits?sha=probe-base&per_page=3" \
            --jq '.[] | {sha: .sha[0:8], author: .commit.author.name, committer: .commit.committer.name, message: .commit.message}'
          echo "::endgroup::"
