name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  SHELLCHECK_VERSION: 0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
  SHFMT_VERSION: 3.14.1
  SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install linters
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"

          fetch() {
            curl --fail --silent --show-error --location --retry 3 -o "$3" "$1"
            printf '%s  %s\n' "$2" "$3" | sha256sum --check --quiet
          }

          fetch "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            "$ACTIONLINT_SHA256" actionlint.tar.gz
          tar -xzf actionlint.tar.gz -C "$bin" actionlint

          fetch "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            "$SHELLCHECK_SHA256" shellcheck.tar.xz
          tar -xJf shellcheck.tar.xz
          mv "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "$bin/shellcheck"

          fetch "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64" \
            "$SHFMT_SHA256" "$bin/shfmt"
          chmod +x "$bin/shfmt"

          printf '%s\n' "$bin" >>"$GITHUB_PATH"

      - name: Report versions
        run: |
          actionlint --version | head -1
          shellcheck --version | grep version:
          shfmt --version
          jq --version

      - name: Lint workflows
        run: |
          actionlint -color -shellcheck "$(command -v shellcheck)" \
            .github/workflows/*.yml workflow-templates/*.yml

      - name: Lint shell
        run: |
          set -euo pipefail
          shopt -s nullglob
          scripts=(actions/*/*.sh)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "no shell scripts to lint"
            exit 0
          fi
          shellcheck -s bash "${scripts[@]}"
          shfmt -d "${scripts[@]}"

      - name: Run the actions' unit tests
        run: |
          set -euo pipefail
          shopt -s nullglob
          status=0
          for test in actions/*/*.test.sh; do
            echo "::group::$test"
            bash "$test" || status=1
            echo "::endgroup::"
          done
          exit "$status"

      - name: Validate action metadata
        run: |
          set -euo pipefail
          shopt -s nullglob
          status=0
          for action in actions/*/action.yml; do
            if ! yq -e '.' "$action" >/dev/null 2>&1; then
              echo "::error file=$action::not valid YAML"
              status=1
              continue
            fi
            for field in name description; do
              if [ -z "$(yq -r ".${field} // \"\"" "$action")" ]; then
                echo "::error file=$action::missing required field '$field'"
                status=1
              fi
            done
            if [ -z "$(yq -r '.runs.using // ""' "$action")" ]; then
              echo "::error file=$action::missing runs.using"
              status=1
            fi
            while IFS= read -r input; do
              [ -n "$input" ] || continue
              if [ -z "$(yq -r ".inputs.\"${input}\".description // \"\"" "$action")" ]; then
                echo "::error file=$action::input '$input' has no description"
                status=1
              fi
            done < <(yq -r '.inputs // {} | keys | .[]' "$action")
          done
          exit "$status"

      - name: Validate starter workflow metadata
        run: |
          set -euo pipefail
          shopt -s nullglob
          status=0
          for wf in workflow-templates/*.yml; do
            props="${wf%.yml}.properties.json"
            if [ ! -f "$props" ]; then
              echo "::error file=$wf::no $(basename "$props") alongside it"
              status=1
              continue
            fi
            if ! jq -e '.' "$props" >/dev/null 2>&1; then
              echo "::error file=$props::not valid JSON"
              status=1
              continue
            fi
            for field in name description; do
              if [ -z "$(jq -r --arg f "$field" '.[$f] // empty' "$props")" ]; then
                echo "::error file=$props::missing required field '$field'"
                status=1
              fi
            done
          done
          for props in workflow-templates/*.properties.json; do
            wf="${props%.properties.json}.yml"
            if [ ! -f "$wf" ]; then
              echo "::error file=$props::no $(basename "$wf") alongside it"
              status=1
            fi
          done
          exit "$status"

      - name: Validate ruleset definitions
        run: |
          set -euo pipefail
          shopt -s nullglob
          status=0
          for rs in rulesets/*.json; do
            if ! jq -e '.' "$rs" >/dev/null 2>&1; then
              echo "::error file=$rs::not valid JSON"
              status=1
              continue
            fi
            for field in name target enforcement rules; do
              if [ "$(jq -r --arg f "$field" '.[$f] // empty | type' "$rs")" = "" ]; then
                echo "::error file=$rs::missing required field '$field'"
                status=1
              fi
            done
            case "$(jq -r '.target // ""' "$rs")" in
              branch | tag | push | repository) ;;
              *) echo "::error file=$rs::target must be branch, tag, push or repository"
                 status=1 ;;
            esac
            if [ "$(jq -r '.rules | length' "$rs")" = 0 ]; then
              echo "::error file=$rs::no rules"
              status=1
            fi
            while IFS= read -r rule; do
              [ -n "$rule" ] || continue
              echo "::error file=$rs::rule has no 'type'"
              status=1
            done < <(jq -c '.rules[] | select(has("type") | not)' "$rs")
            while IFS= read -r actor; do
              [ -n "$actor" ] || continue
              echo "::error file=$rs::bypass actor missing actor_type or bypass_mode: $actor"
              status=1
            done < <(jq -c '.bypass_actors // [] | .[]
                            | select((has("actor_type") and has("bypass_mode")) | not)' "$rs")
          done
          exit "$status"

      - name: Validate the planning vocabularies
        run: |
          set -euo pipefail
          status=0

          for f in planning/conventions.yml planning/labels.yml .github/labels.yml; do
            if ! yq -e '.' "$f" >/dev/null 2>&1; then
              echo "::error file=$f::not valid YAML"
              status=1
            fi
          done
          [ "$status" -eq 0 ] || exit 1

          for key in branch_kinds milestone_kinds hierarchy; do
            if [ "$(yq -r ".${key} // \"\" | length" planning/conventions.yml)" = 0 ]; then
              echo "::error file=planning/conventions.yml::$key is missing or empty"
              status=1
            fi
          done

          # Every label needs all three fields, and a colour GitHub will take.
          while IFS=$'\t' read -r name colour desc; do
            [ -n "$name" ] || continue
            if [ -z "$colour" ] || ! [[ $colour =~ ^[0-9A-Fa-f]{6}$ ]]; then
              echo "::error file=planning/labels.yml::'$name' has colour '$colour', not six hex digits"
              status=1
            fi
            if [ -z "$desc" ]; then
              echo "::error file=planning/labels.yml::'$name' has no description"
              status=1
            fi
          done < <(yq -r '.shared[] | [.name, (.color // ""), (.description // "")] | @tsv' planning/labels.yml)

          if ! [[ $(yq -r '.component_color' planning/labels.yml) =~ ^[0-9A-Fa-f]{6}$ ]]; then
            echo "::error file=planning/labels.yml::component_color is not six hex digits"
            status=1
          fi

          exit "$status"

      - name: Validate the issue and pull request templates
        run: |
          set -euo pipefail
          shopt -s nullglob
          status=0

          # A label an org-default template applies has to exist in this
          # repository as well as the target's, so it must be one we ship.
          known=$(yq -r '.shared[].name' planning/labels.yml)

          check_labels() {
            local file="$1" label
            while IFS= read -r label; do
              [ -n "$label" ] || continue
              if ! grep -qxF -- "$label" <<<"$known"; then
                echo "::error file=$file::applies '$label', which planning/labels.yml does not define"
                status=1
              fi
            done
          }

          for f in .github/ISSUE_TEMPLATE/*.yml; do
            [ "$(basename "$f")" = config.yml ] && continue
            if ! yq -e '.' "$f" >/dev/null 2>&1; then
              echo "::error file=$f::not valid YAML"
              status=1
              continue
            fi
            for key in name description body; do
              if [ "$(yq -r ".${key} // \"\" | length" "$f")" = 0 ]; then
                echo "::error file=$f::$key is missing or empty"
                status=1
              fi
            done
            check_labels "$f" < <(yq -r '.labels // [] | .[]' "$f")
          done

          # A markdown template's frontmatter is the part before the second ---.
          for f in .github/ISSUE_TEMPLATE/*.md; do
            front=$(awk '/^---$/{n++; next} n==1' "$f")
            if ! yq -e '.' <<<"$front" >/dev/null 2>&1; then
              echo "::error file=$f::frontmatter is not valid YAML"
              status=1
              continue
            fi
            for key in name about title type; do
              if [ "$(yq -r ".${key} // \"\"" <<<"$front" | wc -c)" -le 1 ]; then
                echo "::error file=$f::$key is missing from the frontmatter"
                status=1
              fi
            done
            # The title prefix is how the automation learns the Hierarchy level,
            # so a template whose prefix is not in conventions.yml is inert.
            prefix=$(yq -r '.title' <<<"$front")
            if ! prefix="$prefix" yq -e '.hierarchy[] | select(.prefix == strenv(prefix))' \
              planning/conventions.yml >/dev/null 2>&1; then
              echo "::error file=$f::title prefix '$prefix' is not a hierarchy prefix in planning/conventions.yml"
              status=1
            fi
            check_labels "$f" < <(yq -r '.labels // "" | if type == "!!str" then [.] else . end | .[]' <<<"$front")
          done

          for f in .github/PULL_REQUEST_TEMPLATE.md; do
            # /merge parses these two headings, so their absence breaks merging.
            for heading in '## Summary' '## Related issue'; do
              if ! grep -qxF -- "$heading" "$f"; then
                echo "::error file=$f::'$heading' is missing, and /merge parses it"
                status=1
              fi
            done
          done

          if [ ! -f .github/ISSUE_TEMPLATE/config.yml ]; then
            echo "::error ::.github/ISSUE_TEMPLATE/config.yml is missing"
            status=1
          fi

          exit "$status"
