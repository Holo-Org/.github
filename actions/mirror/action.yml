name: Mirror repository
description: >-
  Mirror this repository's branches and tags to another Git remote over SSH.
  Pushes are forced and, by default, pruning: the destination becomes an exact
  copy of the source for the selected refs.

inputs:
  destination:
    description: >-
      SSH URL of the destination repository, e.g. git@github.com:Org/repo.git or
      ssh://git@github.com:22/Org/repo.git. When empty the action does nothing
      and reports mirrored=false, so it is safe to wire up in every repository.
    required: false
    default: ''
  ssh-key:
    description: >-
      Private SSH key allowed to push to the destination. Must have no
      passphrase. Required whenever destination is set.
    required: false
    default: ''
  known-hosts:
    description: >-
      known_hosts entries for the destination host. Left empty, GitHub's
      published keys are used for github.com and ssh-keyscan for any other host.
    required: false
    default: ''
  source-repository:
    description: Repository to mirror, as owner/name.
    required: false
    default: ${{ github.repository }}
  source-token:
    description: Token used to read the source repository.
    required: false
    default: ${{ github.token }}
  branches:
    description: >-
      Branch glob to mirror, relative to refs/heads. Use "*" for every branch,
      or e.g. "release/*". Set to "false" to mirror no branches at all.
    required: false
    default: '*'
  tags:
    description: >-
      Tag glob to mirror, relative to refs/tags. Set to "false" to mirror no
      tags at all.
    required: false
    default: '*'
  prune:
    description: >-
      Delete refs on the destination that no longer exist on the source. Only
      refs matching the branches/tags globs are ever deleted.
    required: false
    default: 'true'
  lfs:
    description: Also transfer Git LFS objects. Best effort; see docs/mirroring.md.
    required: false
    default: 'false'
  dry-run:
    description: Resolve and report everything, but do not write to the destination.
    required: false
    default: 'false'

outputs:
  mirrored:
    description: '"true" when refs were pushed (or would have been, on a dry run).'
    value: ${{ steps.mirror.outputs.mirrored }}
  branches:
    description: Number of branches found on the source.
    value: ${{ steps.mirror.outputs.branches }}
  tags:
    description: Number of tags found on the source.
    value: ${{ steps.mirror.outputs.tags }}

runs:
  using: composite
  steps:
    - id: mirror
      shell: bash
      env:
        MIRROR_DESTINATION: ${{ inputs.destination }}
        MIRROR_SSH_KEY: ${{ inputs.ssh-key }}
        MIRROR_KNOWN_HOSTS: ${{ inputs.known-hosts }}
        MIRROR_SOURCE_REPOSITORY: ${{ inputs.source-repository }}
        MIRROR_SOURCE_TOKEN: ${{ inputs.source-token }}
        MIRROR_BRANCHES: ${{ inputs.branches }}
        MIRROR_TAGS: ${{ inputs.tags }}
        MIRROR_PRUNE: ${{ inputs.prune }}
        MIRROR_LFS: ${{ inputs.lfs }}
        MIRROR_DRY_RUN: ${{ inputs.dry-run }}
      run: "$GITHUB_ACTION_PATH/mirror.sh"
